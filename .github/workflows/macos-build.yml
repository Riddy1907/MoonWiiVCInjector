name: macOS Build

on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Verify bundled wit-mac runs after ad-hoc re-sign
      if: matrix.rid == 'osx-arm64'
      run: |
        mkdir -p /tmp/tooldir && unzip -q "Moon WiiVC Injector/Resources/TOOLDIR.zip" -d /tmp/tooldir
        WIT=$(find /tmp/tooldir -name wit-mac | head -1)
        chmod +x "$WIT"
        echo "Before re-sign:"; "$WIT" --version || echo "exit code $? (expected 137 = killed, invalid signature)"
        /usr/bin/codesign --force --sign - "$WIT"
        echo "After re-sign:"; "$WIT" --version

    - name: Publish
      run: >
        dotnet publish "Moon WiiVC Injector/Moon WiiVC Injector.csproj"
        -c Release -r ${{ matrix.rid }} --self-contained true
        -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

    - name: Package (keeps the executable bit)
      run: tar -czf "MoonWiiVCInjector-${{ matrix.rid }}.tar.gz" -C publish/${{ matrix.rid }} .

    - uses: actions/upload-artifact@v4
      with:
        name: MoonWiiVCInjector-${{ matrix.rid }}
        path: MoonWiiVCInjector-${{ matrix.rid }}.tar.gz

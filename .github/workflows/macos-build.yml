name: macOS Build

on:
  push:
    branches: [ "feature/**" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    strategy:
      matrix:
        rid: [ osx-arm64, osx-x64 ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Verify bundled wit-mac runs after ad-hoc re-sign
      if: matrix.rid == 'osx-arm64'
      run: |
        mkdir -p /tmp/tooldir && unzip -q "Moon WiiVC Injector/Resources/TOOLDIR.zip" -d /tmp/tooldir
        WIT=$(find /tmp/tooldir -name wit-mac | head -1)
        chmod +x "$WIT"
        echo "Before re-sign:"; "$WIT" --version || echo "exit code $? (expected 137 = killed, invalid signature)"
        /usr/bin/codesign --force --sign - "$WIT"
        echo "After re-sign:"; "$WIT" --version

    - name: Publish
      run: >
        dotnet publish "Moon WiiVC Injector/Moon WiiVC Injector.csproj"
        -c Release -r ${{ matrix.rid }} --self-contained true
        -p:PublishSingleFile=true -o publish/${{ matrix.rid }}

    - name: Create .app bundle
      run: |
        set -e
        APP="dist/Moon WiiVC Injector.app"
        VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
        mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
        cp publish/${{ matrix.rid }}/* "$APP/Contents/MacOS/"
        chmod +x "$APP/Contents/MacOS/Moon WiiVC Injector"

        # Icon: WiiU.ico -> PNG -> .icns (skipped if conversion fails)
        ICON_KEY=""
        if sips -s format png "Moon WiiVC Injector/WiiU.ico" --out /tmp/icon.png >/dev/null 2>&1; then
          mkdir -p /tmp/Moon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s /tmp/icon.png --out /tmp/Moon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) /tmp/icon.png --out /tmp/Moon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns /tmp/Moon.iconset -o "$APP/Contents/Resources/AppIcon.icns" && \
            ICON_KEY="<key>CFBundleIconFile</key><string>AppIcon</string>"
        fi

        cat > "$APP/Contents/Info.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0"><dict>
          <key>CFBundleName</key><string>Moon WiiVC Injector</string>
          <key>CFBundleDisplayName</key><string>Moon WiiVC Injector</string>
          <key>CFBundleIdentifier</key><string>io.github.riddy1907.moonwiivcinjector</string>
          <key>CFBundleExecutable</key><string>Moon WiiVC Injector</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>${VERSION}</string>
          <key>CFBundleShortVersionString</key><string>${VERSION}</string>
          <key>LSMinimumSystemVersion</key><string>12.0</string>
          <key>NSHighResolutionCapable</key><true/>
          ${ICON_KEY}
        </dict></plist>
        EOF
        plutil -lint "$APP/Contents/Info.plist"

        # Diagnostics as annotations (readable via the API)
        BIN="$APP/Contents/MacOS/Moon WiiVC Injector"
        codesign -dv --verbose=2 "$BIN" 2>&1 | head -12 | while read -r l; do echo "::notice title=sig-sdk::$l"; done
        if codesign --verify --verbose "$BIN" > /tmp/v.txt 2>&1; then echo "::notice title=verify-sdk::OK"
        else echo "::notice title=verify-sdk::FAILED $(tr '\n' ' ' < /tmp/v.txt)"; fi

    - name: Launch probe (SDK signature vs. re-signed)
      if: matrix.rid == 'osx-arm64'
      run: |
        probe() {
          "$1" > /tmp/probe.log 2>&1 &
          local pid=$!; sleep 15
          if ! kill -0 $pid 2>/dev/null; then echo "exited: $(head -c 200 /tmp/probe.log | tr '\n' ' ')"; return; fi
          local t=$(ps -M -p $pid | tail -n +2 | wc -l | tr -d ' ')
          kill -9 $pid 2>/dev/null; echo "running threads=$t"
        }
        echo "::notice title=probe-raw::$(probe "publish/osx-arm64/Moon WiiVC Injector")"
        echo "::notice title=probe-bundle-sdk-sig::$(probe "dist/Moon WiiVC Injector.app/Contents/MacOS/Moon WiiVC Injector")"
        cp -R "dist/Moon WiiVC Injector.app" /tmp/resigned.app
        codesign --force --deep --sign - /tmp/resigned.app 2>&1 | head -3 || true
        echo "::notice title=probe-resigned-deep::$(probe "/tmp/resigned.app/Contents/MacOS/Moon WiiVC Injector")"

    - name: Create DMG
      run: |
        ln -s /Applications dist/Applications
        hdiutil create -volname "Moon WiiVC Injector" -srcfolder dist -ov -format UDZO \
          "MoonWiiVCInjector-${{ matrix.rid }}.dmg"

    - uses: actions/upload-artifact@v4
      with:
        name: MoonWiiVCInjector-${{ matrix.rid }}-dmg
        path: MoonWiiVCInjector-${{ matrix.rid }}.dmg
